app = "openwa-api"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "2785"
  NODE_ENV = "production"
  ENGINE_TYPE = "baileys"
  DATABASE_TYPE = "sqlite"
  AUTO_START_SESSIONS = "false"
  WEBHOOK_URL = "https://TU-BOT-APP.onrender.com/webhook"
  PUPPETEER_HEADLESS = "true"
  PUPPETEER_ARGS = "--no-sandbox,--disable-setuid-sandbox,--disable-dev-shm-usage"

[mounts]
  source = "openwa_data"
  destination = "/app/data"

[services]
  internal_port = 2785
  protocol = "tcp"

[processes]
  app = "node dist/main"